<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBTI로 포켓몬 찾기</title>
<style>
  :root {
    --cream: #fff8e1;
    --cream-deep: #ffecb3;
    --yellow: #ffca28;
    --yellow-deep: #f9a825;
    --brown: #5d4037;
    --brown-soft: #8d6e63;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--brown);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
    font-size: 20px;
    line-height: 1.7;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 18px 56px;
  }
  header { text-align: center; margin-bottom: 28px; }
  header h1 {
    margin: 0 0 8px;
    font-size: 2.1rem;
    line-height: 1.3;
  }
  header p { margin: 0; font-size: 1.1rem; color: var(--brown-soft); }

  /* 유형 선택 화면 */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .type-btn {
    font: inherit;
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 20px 6px;
    border: 3px solid var(--yellow);
    border-radius: 18px;
    background: var(--white);
    color: var(--brown);
    cursor: pointer;
    transition: transform .12s, background .12s, box-shadow .12s;
    box-shadow: 0 4px 0 var(--yellow-deep);
  }
  .type-btn:hover, .type-btn:focus-visible {
    background: var(--yellow);
    transform: translateY(-2px);
    outline: none;
  }
  .type-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--yellow-deep); }

  /* 결과 화면 */
  .hidden { display: none; }
  .card {
    background: var(--white);
    border: 4px solid var(--yellow);
    border-radius: 28px;
    padding: 30px 24px 28px;
    text-align: center;
    box-shadow: 0 8px 0 var(--yellow-deep);
    animation: pop .35s ease-out;
  }
  @keyframes pop {
    from { transform: scale(.92); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .badge {
    display: inline-block;
    background: var(--cream-deep);
    border-radius: 999px;
    padding: 4px 18px;
    font-weight: 800;
    font-size: 1.15rem;
  }
  .emoji {
    font-size: 8rem;
    line-height: 1.2;
    margin: 10px 0 0;
  }
  .poke-name {
    margin: 0 0 14px;
    font-size: 2.3rem;
  }
  .reason {
    background: var(--cream);
    border-radius: 18px;
    padding: 16px 20px;
    margin: 0 auto 22px;
    text-align: left;
    font-size: 1.15rem;
  }
  .reason p { margin: 0 0 6px; }
  .reason p:last-child { margin-bottom: 0; }

  .match {
    border-top: 3px dashed var(--yellow);
    padding-top: 20px;
  }
  .match h3 { margin: 0 0 10px; font-size: 1.3rem; }
  .match-btn {
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    background: var(--cream-deep);
    color: var(--brown);
    border: 3px solid var(--yellow);
    border-radius: 16px;
    padding: 10px 18px;
    cursor: pointer;
  }
  .match-btn:hover, .match-btn:focus-visible { background: var(--yellow); outline: none; }
  .match-why { margin: 10px 0 0; font-size: 1.05rem; color: var(--brown-soft); }

  .reset {
    margin-top: 26px;
    font: inherit;
    font-size: 1.3rem;
    font-weight: 800;
    background: var(--yellow);
    color: var(--brown);
    border: none;
    border-radius: 999px;
    padding: 14px 40px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--yellow-deep);
  }
  .reset:hover, .reset:focus-visible { background: #ffd54f; outline: none; }
  .reset:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--yellow-deep); }

  @media (max-width: 560px) {
    body { font-size: 18px; }
    header h1 { font-size: 1.7rem; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .emoji { font-size: 6.5rem; }
    .poke-name { font-size: 1.9rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔎 MBTI로 포켓몬 찾기</h1>
    <p id="guide">내 MBTI 유형을 눌러 보세요!</p>
  </header>

  <!-- 1) 유형 선택 -->
  <main id="pick-screen">
    <div class="grid" id="type-grid"></div>
  </main>

  <!-- 2) 결과 -->
  <section id="result-screen" class="hidden" aria-live="polite">
    <div class="card">
      <span class="badge" id="r-type"></span>
      <div class="emoji" id="r-emoji" aria-hidden="true"></div>
      <h2 class="poke-name" id="r-name"></h2>
      <div class="reason" id="r-reason"></div>
      <div class="match">
        <h3>💛 잘 맞는 유형</h3>
        <button class="match-btn" id="r-match" type="button"></button>
        <p class="match-why" id="r-match-why"></p>
      </div>
    </div>
    <div style="text-align:center">
      <button class="reset" id="reset" type="button">🔄 다시 고르기</button>
    </div>
  </section>
</div>

<script>
  // 유형별 데이터: 포켓몬 이름, 이모지, 이유(2~3줄), 궁합 유형, 궁합 이유
  var DATA = {
    INTJ: { name: "뮤츠", emoji: "🔮",
      reason: ["혼자서 깊이 생각하고 큰 계획을 세우는 모습이 닮았어요.", "겉으로는 차분하지만 속에는 강한 신념이 있어요.", "한번 목표를 정하면 끝까지 해내는 전략가예요."],
      match: "ENFP", why: "당신의 계획에 새로운 아이디어와 활기를 불어넣어 줘요." },
    INTP: { name: "후딘", emoji: "🧠",
      reason: ["궁금한 건 끝까지 파고드는 탐구자 스타일이에요.", "머릿속에서는 늘 새로운 생각이 돌아가고 있어요.", "말수는 적어도 필요할 땐 똑똑한 해답을 내놓아요."],
      match: "ENTJ", why: "생각을 현실로 옮기도록 추진력 있게 이끌어 줘요." },
    ENTJ: { name: "리자몽", emoji: "🔥",
      reason: ["앞장서서 팀을 이끄는 당당한 리더 타입이에요.", "목표가 생기면 뜨겁게 불타오르는 열정이 있어요.", "자신감 있게 길을 열어 주는 믿음직한 존재예요."],
      match: "INTP", why: "차분한 분석으로 당신의 계획을 더 탄탄하게 해 줘요." },
    ENTP: { name: "팬텀", emoji: "👻",
      reason: ["장난기 넘치고 재치 있는 말솜씨가 닮았어요.", "틀에 박힌 건 싫어하고 새로운 도전을 좋아해요.", "토론하고 아이디어 내는 걸 즐기는 분위기 메이커예요."],
      match: "INFJ", why: "깊은 통찰로 당신의 아이디어에 방향을 잡아 줘요." },
    INFJ: { name: "가디안", emoji: "💫",
      reason: ["다른 사람의 마음을 먼저 알아채는 따뜻한 수호자예요.", "조용하지만 소중한 사람을 위해선 용감해져요.", "깊은 공감과 직관으로 곁을 지켜 줘요."],
      match: "ENTP", why: "새로운 시각으로 당신의 세계를 넓혀 줘요." },
    INFP: { name: "이브이", emoji: "🦊",
      reason: ["무엇이든 될 수 있는 가능성을 품은 순수한 마음이에요.", "자기만의 감성과 가치관을 소중히 여겨요.", "여리지만 좋아하는 것 앞에선 누구보다 진심이에요."],
      match: "ENFJ", why: "당신의 마음을 따뜻하게 알아주고 응원해 줘요." },
    ENFJ: { name: "루카리오", emoji: "🐺",
      reason: ["친구들을 이끌고 챙기는 의리파 리더예요.", "다른 사람의 감정을 잘 읽고 힘이 되어 줘요.", "정의감과 따뜻함을 함께 가진 든든한 동료예요."],
      match: "INFP", why: "깊고 진솔한 마음으로 당신에게 힘을 줘요." },
    ENFP: { name: "피카츄", emoji: "⚡",
      reason: ["어디서나 분위기를 밝게 만드는 에너지 덩어리예요.", "사람을 좋아하고 새로운 일에 늘 신나게 뛰어들어요.", "누구와도 금방 친해지는 사랑스러운 매력이 있어요."],
      match: "INTJ", why: "든든한 계획력으로 당신의 열정을 현실로 만들어 줘요." },
    ISTJ: { name: "거북왕", emoji: "🐢",
      reason: ["맡은 일은 꼼꼼하게 끝까지 책임지는 성실파예요.", "단단한 껍질처럼 흔들림 없이 원칙을 지켜요.", "말보다 행동으로 믿음을 주는 든든한 존재예요."],
      match: "ESFP", why: "일상에 즐거움과 웃음을 더해 줘요." },
    ISFJ: { name: "해피너스", emoji: "🥚",
      reason: ["주변 사람을 세심하게 챙기는 따뜻한 돌봄이예요.", "눈에 띄지 않아도 묵묵히 곁을 지켜 줘요.", "상대가 필요한 걸 먼저 알아채는 배려의 달인이에요."],
      match: "ESTP", why: "활동적인 에너지로 당신을 세상 밖으로 이끌어 줘요." },
    ESTJ: { name: "윈디", emoji: "🐕",
      reason: ["규칙과 질서를 지키며 팀을 이끄는 리더예요.", "듬직하고 의리 있어서 믿고 맡길 수 있어요.", "정해진 목표를 향해 힘차게 달려가는 실행가예요."],
      match: "ISFP", why: "부드러운 감성으로 당신의 마음에 여유를 줘요." },
    ESFJ: { name: "라프라스", emoji: "🌊",
      reason: ["사람들을 등에 태우고 함께 가는 다정한 친구예요.", "모두가 편안하도록 분위기를 챙겨요.", "베푸는 걸 좋아하고 모임에서 인기가 많아요."],
      match: "ISTP", why: "침착하고 쿨한 매력으로 균형을 맞춰 줘요." },
    ISTP: { name: "나옹", emoji: "🐱",
      reason: ["필요할 땐 재빠르고 평소엔 느긋한 자유로운 영혼이에요.", "말은 적지만 손재주와 문제 해결 능력이 좋아요.", "간섭받는 건 싫어하고 내 방식대로 움직여요."],
      match: "ESFJ", why: "따뜻한 관심으로 당신을 살뜰히 챙겨 줘요." },
    ISFP: { name: "치코리타", emoji: "🌿",
      reason: ["조용하고 온화해서 곁에 있으면 마음이 편해져요.", "자연과 예쁜 것을 좋아하는 감성파예요.", "남과 다투기보다 자기만의 속도로 살아가요."],
      match: "ESTJ", why: "듬직하게 앞길을 이끌며 안정감을 줘요." },
    ESTP: { name: "한카리아스", emoji: "🦈",
      reason: ["생각보다 행동이 먼저 나가는 시원시원한 모험가예요.", "빠른 판단력으로 위기에도 당황하지 않아요.", "스릴과 도전을 즐기는 액션 스타예요."],
      match: "ISFJ", why: "다정한 보살핌으로 지친 마음을 쉬게 해 줘요." },
    ESFP: { name: "푸린", emoji: "🎤",
      reason: ["노래하고 춤추며 모두를 즐겁게 하는 분위기 스타예요.", "지금 이 순간을 마음껏 즐길 줄 알아요.", "표정과 감정이 솔직해서 사랑받는 매력이 있어요."],
      match: "ISTJ", why: "든든하게 받쳐 주며 안정감을 더해 줘요." }
  };

  var ORDER = ["INTJ","INTP","ENTJ","ENTP","INFJ","INFP","ENFJ","ENFP",
               "ISTJ","ISFJ","ESTJ","ESFJ","ISTP","ISFP","ESTP","ESFP"];

  var pickScreen = document.getElementById("pick-screen");
  var resultScreen = document.getElementById("result-screen");
  var guide = document.getElementById("guide");
  var grid = document.getElementById("type-grid");

  // 16개 버튼 만들기
  ORDER.forEach(function (type) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "type-btn";
    b.textContent = type;
    b.addEventListener("click", function () { show(type); });
    grid.appendChild(b);
  });

  function show(type) {
    var d = DATA[type];
    var m = DATA[d.match];

    document.getElementById("r-type").textContent = type;
    document.getElementById("r-emoji").textContent = d.emoji;
    document.getElementById("r-name").textContent = d.name;

    var box = document.getElementById("r-reason");
    box.innerHTML = "";
    d.reason.forEach(function (line) {
      var p = document.createElement("p");
      p.textContent = "✔ " + line;
      box.appendChild(p);
    });

    var mb = document.getElementById("r-match");
    mb.textContent = d.match + " · " + m.emoji + " " + m.name;
    mb.onclick = function () { show(d.match); };
    document.getElementById("r-match-why").textContent = d.match + " 유형은 " + d.why;

    pickScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");
    guide.textContent = "당신과 닮은 포켓몬을 찾았어요!";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  document.getElementById("reset").addEventListener("click", function () {
    resultScreen.classList.add("hidden");
    pickScreen.classList.remove("hidden");
    guide.textContent = "내 MBTI 유형을 눌러 보세요!";
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>
</body>
</html>
